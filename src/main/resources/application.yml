server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notificaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 3
          multiplier: 2
  # ─────────────────────────────────────────────────────────────
  # SMTP — usa Mailtrap para desarrollo local (gratuito)
  # 1. Crea cuenta en https://mailtrap.io
  # 2. Ve a Email Testing → Inboxes → tu inbox → SMTP Settings
  # 3. Copia Username y Password y ponlos aquí (o en env vars)
  # Para producción: cambia host a smtp.gmail.com, port a 587
  # ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:aafc0f001@smtp-brevo.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

notificaciones:
  mail:
    enabled: ${MAIL_ENABLED:true}   # false = solo loguea, true = envía SMTP real

logging:
  level:
    com.staysync: DEBUG
    org.springframework.amqp: INFO
