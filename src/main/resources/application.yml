server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notificaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3312/notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:staysync_not}
    password: ${SPRING_DATASOURCE_PASSWORD:StaySync@Not#2024$Pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:staysync_rabbit}
    password: ${RABBITMQ_PASSWORD:StaySync@Rabbit#2024$Pass}
    virtual-host: ${RABBITMQ_VHOST:staysync_vhost}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 30000
          max-attempts: 3
          multiplier: 10
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@staysync.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.staysync: INFO
